mode: paper
dry_run: true
sell_enabled: false

assets:
  tickers: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
  adv_usd_table: { BTCUSDT: 9.0e9, ETHUSDT: 4.0e9, SOLUSDT: 1.2e9 }
  top_depth_usd: { BTCUSDT: 5.0e6, ETHUSDT: 3.0e6, SOLUSDT: 1.0e6 }
  clusters: { BTCUSDT: "majors", ETHUSDT: "majors", SOLUSDT: "alts" }

llm:
  budget_usd_per_min: 0.20
  token_budget_per_tick: 1500
  max_on_demand_features: 2
  aggregator_tau: 1.0
  stages:
    A: { provider: "deepseek", max_tokens: 600, temperature: 0.2 }
    B: { provider: "qwen", max_tokens: 600, temperature: 0.2 }
    C: { provider: "claude", max_tokens: 800, temperature: 0.2, min_uncertainty: 0.35, min_budget_left: 0.25 }
  reliability:
    window: 200
    lambda: 0.6

risk_gate:
  limits: { per_trade_loss_pct: 0.5, per_day_loss_pct: 2.0, max_drawdown_pct: 15.0 }
  sizing: { pos_cap_per_asset_pct: 1.0, cluster_cap_pct: 2.0 }
  market: { max_spread_bps: 15 }
  cooldowns: { after_stop_sec: 300, min_between_trades_sec: 60 }
  circuit_breakers: { ece_threshold: 0.08, hitrate_drop_window: 200 }
  pnl_breaker: { day_loss_pct: 0.25, week_loss_pct: 0.8 }

execution:
  enforce_exchange_filters: false
  ttl_sec_range: [30, 90]
  price_bands_vol_mult: 1.5
  minimal_notional_usd: 5
  low_top_depth_usd: 100000
  strategies: [POST_ONLY, IOC, POV]
  strategy_thresholds: { pov_adv_max_pct: 0.2, post_only_spread_frac: 0.5, strong_signal_z: 1.5 }
  post_only_queue_penalty_bps: 0.5

economics:
  stress_slippage_prob: 0.3
  normal: { k_vol_bps: 0.25, sigma: 0.5 }
  stress: { k_vol_bps: 0.6, sigma: 1.1 }

calendar:
  timezone: UTC
  blackout_windows: []
  overrides: []
  events_utc: []

rolling_metrics:
  windows:
    - 200
    - 500
  min_samples: 20

order_management: { deduplication_window_sec: 300, retries: 1, idempotency_prefix: "arena-" }

logging:
  level: INFO
  paths:
    decisions: data/logs/decisions.jsonl
    execution: data/logs/execution.jsonl
    audit: data/logs/audit.jsonl
    alerts: data/logs/alerts.jsonl

monitoring:
  metrics_port: 9108
  health_interval_sec: 15
  alert_sink: telegram
  alert_min_level: info
  alert_dedup_window_sec: 60

exchange:
  name: binance_spot
  base_url: https://api.binance.com
  ws_url: wss://stream.binance.com:9443/ws
  recv_window_ms: 5000
  account_type: spot
  time_sync_sec: 60
  max_clock_skew_ms: 1500
  precision_cache_ttl_sec: 600
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET

telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

units: { tolerance_bps: 1.0, enforce: true }
schemas: { version: 2 }
storage_dir: data
sqlite_path: arena.sqlite3
