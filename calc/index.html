<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Простой калькулятор</title>
  <style>
    :root{
      --bg:#0b0c0f; --panel:#151821; --text:#e7e9ee; --muted:#98a2b3; --accent:#7c5cff; --border:#232838;
      --ok:#16a34a; --warn:#f59e0b; --err:#ef4444;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f7f7fb; --panel:#ffffff; --text:#0b1020; --muted:#667085; --accent:#6d28d9; --border:#e6e8ee; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif;
      background:radial-gradient(70% 80% at 20% 0%, rgba(124,92,255,.12), transparent 60%), var(--bg);
      color:var(--text);
      display:grid; place-items:center;
      padding:24px;
    }
    .card{
      width:min(560px, 100%);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.15);
    }
    h1{font-size:clamp(20px, 2.2vw, 26px); margin:0 0 12px}
    p.hint{margin:0 0 16px; color:var(--muted); font-size:14px}
    form{display:grid; gap:12px}
    .row{display:grid; grid-template-columns:1fr 120px 1fr; gap:12px}
    @media (max-width:520px){ .row{ grid-template-columns:1fr; } }

    label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px}
    input, select, button{
      width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#0f1320; color:var(--text);
    }
    @media (prefers-color-scheme: light){ input, select, button{ background:#fff; } }
    input::placeholder{color:#9aa3b2}
    .actions{display:flex; gap:10px; flex-wrap:wrap}
    button{
      cursor:pointer; font-weight:600; letter-spacing:.2px; transition:transform .05s ease, box-shadow .2s ease, background .2s ease;
    }
    .primary{ background:var(--accent); border-color:transparent; }
    .primary:active{ transform:translateY(1px) }
    .ghost{ background:transparent }
    .kbd{font:600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; color:var(--muted)}

    .result{margin-top:8px; padding:14px; border-radius:12px; background:rgba(124,92,255,.08); border:1px dashed var(--border); display:none}
    .result.ok{ display:block; border-color:rgba(124,92,255,.35) }
    .result.warn{ display:block; background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.35) }

    .error{margin-top:8px; padding:12px; border-radius:12px; background:rgba(239,68,68,.1); color:#fecaca; border:1px solid rgba(239,68,68,.35); display:none}
    @media (prefers-color-scheme: light){ .error{ color:#991b1b; } }

    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Простой калькулятор</h1>
    <p class="hint">Введите два числа, выберите оператор и нажмите «Посчитать». Деление на ноль перехватывается.
      <span class="kbd">Enter</span> тоже сработает.</p>

    <form id="calc" autocomplete="off" novalidate>
      <div class="row">
        <div>
          <label for="a">Первое число</label>
          <input id="a" name="a" type="text" inputmode="decimal" placeholder="например, 12.5" required>
        </div>
        <div>
          <label for="op">Оператор</label>
          <select id="op" name="op" aria-label="Оператор">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
          </select>
        </div>
        <div>
          <label for="b">Второе число</label>
          <input id="b" name="b" type="text" inputmode="decimal" placeholder="например, 3,2" required>
        </div>
      </div>

      <div class="actions">
        <button class="primary" type="submit">Посчитать</button>
        <button class="ghost" type="reset">Сбросить</button>
      </div>

      <div id="error" class="error" role="alert" aria-live="assertive"></div>
      <div id="result" class="result ok" aria-live="polite"></div>
    </form>

    <p class="hint" style="margin-top:14px">Поддерживает точку и запятую в качестве десятичного разделителя.</p>
    <span class="sr-only" id="sr-status" aria-live="polite"></span>
  </main>

  <script>
    const form = document.getElementById('calc');
    const fieldA = document.getElementById('a');
    const fieldB = document.getElementById('b');
    const op = document.getElementById('op');
    const out = document.getElementById('result');
    const err = document.getElementById('error');
    const sr = document.getElementById('sr-status');

    function parseNumber(v){
      if (typeof v !== 'string') v = String(v ?? '');
      // заменяем запятую на точку, чтобы iOS/Android корректно парсили
      v = v.trim().replace(/,/g, '.');
      const n = Number(v);
      return Number.isFinite(n) ? n : NaN;
    }

    function fmt(n){
      if (!Number.isFinite(n)) return String(n);
      // Избавляемся от лишних нулей, но сохраняем точность
      const s = n.toString();
      if (s.includes('e') || s.includes('E')) return n.toString();
      const fixed = n.toFixed(10); // максимум 10 знаков
      return fixed.replace(/\.?(0+)$/,'').replace(/\.$/,'');
    }

    function calculate(a, b, operator){
      switch(operator){
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return a / b;
        default: throw new Error('Неизвестный оператор');
      }
    }

    function showError(message){
      err.textContent = message;
      err.style.display = 'block';
      out.style.display = 'none';
      sr.textContent = 'Ошибка: ' + message;
    }

    function showResult(text, warn=false){
      err.style.display = 'none';
      out.textContent = text;
      out.classList.toggle('warn', warn);
      out.classList.toggle('ok', !warn);
      out.style.display = 'block';
      sr.textContent = 'Результат готов';
    }

    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const a = parseNumber(fieldA.value);
      const b = parseNumber(fieldB.value);
      const operator = op.value;

      if (Number.isNaN(a) || Number.isNaN(b)){
        showError('Пожалуйста, введите корректные числа. Разрешены и точка, и запятая.');
        return;
      }
      if (operator === '/' && b === 0){
        showError('Деление на ноль невозможно. Измените второе число.');
        return;
      }

      try{
        const r = calculate(a, b, operator);
        const expr = `${fmt(a)} ${operator} ${fmt(b)} = ${fmt(r)}`;
        const warn = !Number.isFinite(r) || Math.abs(r) > 1e12; // простая подсветка подозрительных значений
        showResult(expr, warn);
      }catch(ex){
        showError(ex.message);
      }
    });

    form.addEventListener('reset', ()=>{
      err.style.display = 'none';
      out.style.display = 'none';
      sr.textContent = 'Форма очищена';
      setTimeout(()=>fieldA.focus(), 0);
    });

    // Ставим фокус на первое поле при загрузке
    window.addEventListener('DOMContentLoaded', ()=> fieldA.focus());
  </script>
</body>
</html>
