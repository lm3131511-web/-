services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  codex-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file:
      - .env
    environment:
      CODEX_ENV: "live"
      CODEX_CONFIG_DIR: "/app/configs"
      REDIS_URL: "redis://redis:6379/0"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      QWEN_MODEL: "${QWEN_MODEL}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL}"
      ANTHROPIC_VERSION: "${ANTHROPIC_VERSION}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS}"
      LLM_RETRY_MAX: "${LLM_RETRY_MAX}"
      LLM_RETRY_BACKOFF_MS: "${LLM_RETRY_BACKOFF_MS}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # - ./configs:/app/configs:ro  # Uncomment to override configs during local dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health | grep -q '\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  codex-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      CODEX_ENV: "live"
      CODEX_CONFIG_DIR: "/app/configs"
      REDIS_URL: "redis://redis:6379/0"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      QWEN_MODEL: "${QWEN_MODEL}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL}"
      ANTHROPIC_VERSION: "${ANTHROPIC_VERSION}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS}"
      LLM_RETRY_MAX: "${LLM_RETRY_MAX}"
      LLM_RETRY_BACKOFF_MS: "${LLM_RETRY_BACKOFF_MS}"
    volumes:
      - ./data:/app/data
      # - ./configs:/app/configs:ro  # Uncomment to override configs during local dev
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      codex-app:
        condition: service_started
