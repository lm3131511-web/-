{
  "runtime": {
    "environment": "shadow",
    "quant_only_mode": false
  },
  "llm": {
    "timeout_ms": 3000
  },
  "llm_risk": {
    "distributed": {"url": "redis://redis:6379/0"},
    "fallback": {"enable_quant_only_after_failures": 2}
  },
  "news": {
