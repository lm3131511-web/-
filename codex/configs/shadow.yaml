      "twitter": {"enabled": true, "trusted_sources": ["@binance", "@CoinDesk", "@Glassnode"]},
      "reddit": {"enabled": true, "max_items": 180},
      "news": {"enabled": true, "window_min": 120}
    }
  }
}
