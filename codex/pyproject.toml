[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex"
version = "2.2.2"
description = "Codex risk and news intelligence service"
authors = [{name = "Codex Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.2",
    "starlette==0.40.0",
    "uvicorn[standard]==0.32.0",
    "anyio==4.6.2.post1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0.2,<7",
    "redis>=5.0",
    "fakeredis>=2.23",
    "prometheus-client>=0.20,<0.22",
    "httpx>=0.27,<0.28",
    "jsonschema>=4.21",
    "hypothesis>=6.99",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["codex*"]
exclude = ["tests*", "*_stubs*"]
