[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex"
version = "2.2.1"
description = "Codex risk and news intelligence service"
authors = [{name = "Codex Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.115",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "redis>=5.0",
    "fakeredis>=2.23",
    "prometheus-client>=0.20,<0.22",
    "httpx>=0.27,<0.28",
    "jsonschema>=4.21",
    "hypothesis>=6.99",
    "anyio>=4.4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
