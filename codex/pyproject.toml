[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex"
version = "2.2.0"
description = "Codex risk and news intelligence service"
authors = [{name = "Codex Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "redis>=5.0",
    "fakeredis>=2.23",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "hypothesis>=6.99",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
